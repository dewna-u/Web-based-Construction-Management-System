<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Issues')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Issues')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header">
                <div><h2>Issues</h2>
                    <p class="subtitle"><span th:text="${openCount}">0</span> open · <span th:text="${criticalOpenCount}">0</span> critical</p></div>
                <div class="page-actions">
                    <a class="btn btn-primary" th:href="@{/issues/new}"><i class="bi bi-plus-lg me-1"></i> Report Issue</a>
                </div>
            </div>
            <form class="filter-bar row g-2 align-items-end" method="get" th:action="@{/issues}">
                <div class="col-md-3"><label class="form-label">Project</label>
                    <select class="form-select" name="projectId"><option value="">All</option>
                        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${projectId == p.id}"></option></select></div>
                <div class="col-md-3"><label class="form-label">Severity</label>
                    <select class="form-select" name="severity"><option value="">All</option>
                        <option th:each="s : ${severities}" th:value="${s}" th:text="${s}" th:selected="${severity == s}"></option></select></div>
                <div class="col-md-3"><label class="form-label">Status</label>
                    <select class="form-select" name="status"><option value="">All</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option></select></div>
                <div class="col-md-3"><button class="btn btn-navy w-100" type="submit">Filter</button></div>
            </form>
            <div class="card-bf"><div class="card-body-bf p-0">
                <div th:if="${page == null or page.content.empty}" class="empty-state"><i class="bi bi-shield-check"></i><h3>No issues</h3></div>
                <div class="table-wrap" th:unless="${page == null or page.content.empty}">
                    <table class="table-bf">
                        <thead><tr><th>Title</th><th>Project</th><th>Severity</th><th>Status</th><th>Reported</th><th>Assignee</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="i : ${page.content}">
                            <td><a th:href="@{/issues/{id}(id=${i.id})}" th:text="${i.title}"></a></td>
                            <td th:text="${i.project != null ? i.project.name : '—'}"></td>
                            <td><span class="badge-status" th:classappend="${i.severity.name() == 'CRITICAL' or i.severity.name() == 'HIGH'} ? ' badge-danger' : ' badge-secondary'" th:text="${i.severity}"></span></td>
                            <td><span class="badge-status badge-navy" th:text="${i.status}"></span></td>
                            <td th:text="${i.reportedDate}"></td>
                            <td th:text="${i.assignedTo != null ? i.assignedTo.fullName : '—'}"></td>
                            <td class="actions"><a class="btn btn-sm btn-ghost btn-icon" th:href="@{/issues/{id}(id=${i.id})}"><i class="bi bi-eye"></i></a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer-bf" th:if="${page != null and !page.content.empty}"><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
