<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Issues')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Issues')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header"><div><h2 th:text="${pageTitle}">Issue</h2></div><a class="btn btn-ghost" th:href="@{/issues}">Back</a></div>
            <div class="card-bf"><div class="card-body-bf">
                <form th:object="${issueForm}" th:action="${issueForm.id == null} ? @{/issues} : @{/issues/{id}(id=${issueForm.id})}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" th:field="*{id}"/>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert-bf error mb-3"><div><p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div></div>
                    <div class="row g-3">
                        <div class="col-md-8"><label class="form-label">Title *</label><input class="form-control" th:field="*{title}"/><div class="field-error" th:errors="*{title}"></div></div>
                        <div class="col-md-4"><label class="form-label">Project *</label>
                            <select class="form-select" th:field="*{projectId}"><option value="">Select</option>
                                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option></select>
                            <div class="field-error" th:errors="*{projectId}"></div></div>
                        <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="4" th:field="*{description}"></textarea></div>
                        <div class="col-md-3"><label class="form-label">Severity *</label>
                            <select class="form-select" th:field="*{severity}"><option th:each="s : ${severities}" th:value="${s}" th:text="${s}"></option></select></div>
                        <div class="col-md-3"><label class="form-label">Status *</label>
                            <select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></div>
                        <div class="col-md-3"><label class="form-label">Reported date</label><input type="date" class="form-control" th:field="*{reportedDate}"/></div>
                        <div class="col-md-3"><label class="form-label">Assignee</label>
                            <select class="form-select" th:field="*{assignedToId}"><option value="">Unassigned</option>
                                <option th:each="a : ${assignees}" th:value="${a.id}" th:text="${a.fullName}"></option></select></div>
                        <div class="col-md-4"><label class="form-label">Resolved date</label><input type="date" class="form-control" th:field="*{resolvedDate}"/></div>
                        <div class="col-md-8"><label class="form-label">Resolution notes</label><textarea class="form-control" rows="2" th:field="*{resolutionNotes}"></textarea></div>
                    </div>
                    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Save Issue</button><a class="btn btn-ghost" th:href="@{/issues}">Cancel</a></div>
                </form>
            </div></div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
