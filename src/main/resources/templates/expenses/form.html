<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Budget / Expenses')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Budget / Expenses')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header"><div><h2 th:text="${pageTitle}">Expense</h2></div><a class="btn btn-ghost" th:href="@{/expenses}">Back</a></div>
            <div class="card-bf"><div class="card-body-bf">
                <form th:object="${expenseForm}" th:action="${expenseForm.id == null} ? @{/expenses} : @{/expenses/{id}(id=${expenseForm.id})}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" th:field="*{id}"/>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert-bf error mb-3"><div><p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div></div>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Project *</label>
                            <select class="form-select" th:field="*{projectId}"><option value="">Select</option>
                                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option></select>
                            <div class="field-error" th:errors="*{projectId}"></div></div>
                        <div class="col-md-6"><label class="form-label">Category *</label>
                            <select class="form-select" th:field="*{category}"><option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option></select></div>
                        <div class="col-12"><label class="form-label">Description *</label><input class="form-control" th:field="*{description}"/><div class="field-error" th:errors="*{description}"></div></div>
                        <div class="col-md-4"><label class="form-label">Amount *</label><input type="number" step="0.01" class="form-control" th:field="*{amount}"/><div class="field-error" th:errors="*{amount}"></div></div>
                        <div class="col-md-4"><label class="form-label">Date *</label><input type="date" class="form-control" th:field="*{expenseDate}"/><div class="field-error" th:errors="*{expenseDate}"></div></div>
                        <div class="col-md-4"><label class="form-label">Reference</label><input class="form-control" th:field="*{reference}"/></div>
                        <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div>
                    </div>
                    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Save Expense</button><a class="btn btn-ghost" th:href="@{/expenses}">Cancel</a></div>
                </form>
            </div></div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
