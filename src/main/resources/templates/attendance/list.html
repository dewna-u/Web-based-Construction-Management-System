<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Attendance')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Attendance')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header">
                <div><h2>Attendance</h2><p class="subtitle">Daily site presence records</p></div>
                <div class="page-actions" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER')">
                    <a class="btn btn-primary" th:href="@{/attendance/new}"><i class="bi bi-plus-lg me-1"></i> Record Attendance</a>
                </div>
            </div>
            <form class="filter-bar row g-2 align-items-end" method="get" th:action="@{/attendance}">
                <div class="col-md-3"><label class="form-label">Date</label><input type="date" class="form-control" name="date" th:value="${date}"/></div>
                <div class="col-md-3"><label class="form-label">Project</label>
                    <select class="form-select" name="projectId"><option value="">All</option>
                        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${projectId == p.id}"></option></select></div>
                <div class="col-md-3"><label class="form-label">Worker</label>
                    <select class="form-select" name="workerId"><option value="">All</option>
                        <option th:each="w : ${workers}" th:value="${w.id}" th:text="${w.fullName}" th:selected="${workerId == w.id}"></option></select></div>
                <div class="col-md-3"><button class="btn btn-navy w-100" type="submit">Filter</button></div>
            </form>
            <div class="stat-grid" th:if="${summary != null}">
                <div class="stat-card" th:each="entry : ${summary}">
                    <div class="stat-icon navy"><i class="bi bi-calendar-check"></i></div>
                    <div class="stat-meta"><div class="stat-label" th:text="${entry.key}"></div><div class="stat-value" th:text="${entry.value}"></div></div>
                </div>
            </div>
            <div class="card-bf"><div class="card-body-bf p-0">
                <div th:if="${page == null or page.content.empty}" class="empty-state"><i class="bi bi-calendar-x"></i><h3>No attendance records</h3></div>
                <div class="table-wrap" th:unless="${page == null or page.content.empty}">
                    <table class="table-bf">
                        <thead><tr><th>Date</th><th>Worker</th><th>Project</th><th>Status</th><th>Notes</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${page.content}">
                            <td th:text="${r.attendanceDate}"></td>
                            <td th:text="${r.worker != null ? r.worker.fullName : '—'}"></td>
                            <td th:text="${r.worker != null and r.worker.assignedProject != null ? r.worker.assignedProject.name : '—'}"></td>
                            <td><span class="badge-status badge-navy" th:text="${r.status}"></span></td>
                            <td th:text="${r.notes}"></td>
                            <td class="actions">
                                <a class="btn btn-sm btn-ghost btn-icon" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER')" th:href="@{/attendance/{id}/edit(id=${r.id})}"><i class="bi bi-pencil"></i></a>
                                <form class="inline-form" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')" th:action="@{/attendance/{id}/delete(id=${r.id})}" method="post" data-confirm="Delete this record?">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button class="btn btn-sm btn-danger-soft btn-icon"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer-bf" th:if="${page != null and !page.content.empty}"><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
