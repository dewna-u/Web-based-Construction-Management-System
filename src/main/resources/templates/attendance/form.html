<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Attendance')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Attendance')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header"><div><h2 th:text="${pageTitle}">Attendance</h2></div><a class="btn btn-ghost" th:href="@{/attendance}">Back</a></div>
            <div class="card-bf"><div class="card-body-bf">
                <form th:object="${attendanceForm}" th:action="${attendanceForm.id == null} ? @{/attendance} : @{/attendance/{id}(id=${attendanceForm.id})}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" th:field="*{id}"/>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert-bf error mb-3"><div><p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div></div>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Worker *</label>
                            <select class="form-select" th:field="*{workerId}"><option value="">Select</option>
                                <option th:each="w : ${workers}" th:value="${w.id}" th:text="${w.fullName}"></option></select>
                            <div class="field-error" th:errors="*{workerId}"></div></div>
                        <div class="col-md-3"><label class="form-label">Date *</label><input type="date" class="form-control" th:field="*{attendanceDate}"/><div class="field-error" th:errors="*{attendanceDate}"></div></div>
                        <div class="col-md-3"><label class="form-label">Status *</label>
                            <select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></div>
                        <div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div>
                    </div>
                    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Save</button><a class="btn btn-ghost" th:href="@{/attendance}">Cancel</a></div>
                </form>
            </div></div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
