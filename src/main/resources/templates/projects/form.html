<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Projects')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Projects')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header">
                <div>
                    <h2 th:text="${pageTitle}">Project Form</h2>
                    <p class="subtitle">Define site details, ownership, and budget</p>
                </div>
                <a class="btn btn-ghost" th:href="@{/projects}"><i class="bi bi-arrow-left me-1"></i> Back</a>
            </div>
            <div class="card-bf">
                <div class="card-body-bf">
                    <form th:object="${projectForm}"
                          th:action="${projectForm.id == null} ? @{/projects} : @{/projects/{id}(id=${projectForm.id})}"
                          method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:field="*{id}"/>
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert-bf error mb-3">
                            <i class="bi bi-exclamation-octagon-fill"></i>
                            <div><p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div>
                        </div>
                        <h3 class="form-section-title">Basics</h3>
                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="form-label">Name *</label>
                                <input class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"/>
                                <div class="field-error" th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Project code *</label>
                                <input class="form-control" th:field="*{projectCode}" th:classappend="${#fields.hasErrors('projectCode')} ? ' is-invalid'"/>
                                <div class="field-error" th:errors="*{projectCode}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                                <div class="field-error" th:errors="*{description}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Location</label>
                                <input class="form-control" th:field="*{location}"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Status *</label>
                                <select class="form-select" th:field="*{status}">
                                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                                </select>
                            </div>
                        </div>
                        <h3 class="form-section-title">Ownership &amp; schedule</h3>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Client *</label>
                                <select class="form-select" th:field="*{clientId}" th:classappend="${#fields.hasErrors('clientId')} ? ' is-invalid'">
                                    <option value="">Select client</option>
                                    <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.fullName + ' (' + c.email + ')'}"></option>
                                </select>
                                <div class="field-error" th:errors="*{clientId}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Project manager</label>
                                <select class="form-select" th:field="*{managerId}">
                                    <option value="">Unassigned</option>
                                    <option th:each="m : ${managers}" th:value="${m.id}" th:text="${m.fullName}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Start date</label>
                                <input type="date" class="form-control" th:field="*{startDate}"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Expected end</label>
                                <input type="date" class="form-control" th:field="*{expectedEndDate}"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Actual end</label>
                                <input type="date" class="form-control" th:field="*{actualEndDate}"/>
                            </div>
                        </div>
                        <h3 class="form-section-title">Budget &amp; progress</h3>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label">Budget</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{budget}"/>
                                <div class="field-error" th:errors="*{budget}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Progress %</label>
                                <input type="number" min="0" max="100" class="form-control" th:field="*{progressPercentage}"/>
                                <div class="field-error" th:errors="*{progressPercentage}"></div>
                            </div>
                            <div class="col-md-4 d-flex align-items-end" th:if="${projectForm.id != null}">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" th:field="*{archived}" id="archived"/>
                                    <label class="form-check-label" for="archived">Archived</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save Project</button>
                            <a class="btn btn-ghost" th:href="@{/projects}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
