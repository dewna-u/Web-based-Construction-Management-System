<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Material Requests')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Material Requests')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header">
                <div><h2>Material Requests</h2>
                    <p class="subtitle"><span th:text="${pendingCount}">0</span> pending approval</p></div>
                <div class="page-actions" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER','CONTRACTOR')">
                    <a class="btn btn-primary" th:href="@{/material-requests/new}"><i class="bi bi-plus-lg me-1"></i> New Request</a>
                </div>
            </div>
            <form class="filter-bar row g-2 align-items-end" method="get" th:action="@{/material-requests}">
                <div class="col-md-5"><label class="form-label">Project</label>
                    <select class="form-select" name="projectId"><option value="">All</option>
                        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${projectId == p.id}"></option></select></div>
                <div class="col-md-5"><label class="form-label">Status</label>
                    <select class="form-select" name="status"><option value="">All</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option></select></div>
                <div class="col-md-2"><button class="btn btn-navy w-100" type="submit">Filter</button></div>
            </form>
            <div class="card-bf"><div class="card-body-bf p-0">
                <div th:if="${page == null or page.content.empty}" class="empty-state"><i class="bi bi-clipboard-check"></i><h3>No requests</h3></div>
                <div class="table-wrap" th:unless="${page == null or page.content.empty}">
                    <table class="table-bf">
                        <thead><tr><th>Date</th><th>Project</th><th>Material</th><th>Qty</th><th>Required</th><th>Status</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${page.content}">
                            <td th:text="${r.requestDate}"></td>
                            <td th:text="${r.project != null ? r.project.name : '—'}"></td>
                            <td th:text="${r.material != null ? r.material.name : '—'}"></td>
                            <td th:text="${r.quantity}"></td>
                            <td th:text="${r.requiredDate}"></td>
                            <td><span class="badge-status badge-navy" th:text="${r.status}"></span></td>
                            <td class="actions"><a class="btn btn-sm btn-ghost btn-icon" th:href="@{/material-requests/{id}(id=${r.id})}"><i class="bi bi-eye"></i></a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer-bf" th:if="${page != null and !page.content.empty}"><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
