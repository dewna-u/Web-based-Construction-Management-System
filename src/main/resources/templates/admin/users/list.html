<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Users (Admin)')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Users (Admin)')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header">
                <div><h2>Users</h2><p class="subtitle">Manage accounts and roles</p></div>
                <div class="page-actions">
                    <form th:action="@{/admin/demo-data}" method="post" data-confirm="Generate demo data?">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-navy"><i class="bi bi-magic me-1"></i> Generate Demo Data</button>
                    </form>
                    <a class="btn btn-primary" th:href="@{/admin/users/new}"><i class="bi bi-plus-lg me-1"></i> Create User</a>
                </div>
            </div>
            <form class="filter-bar row g-2 align-items-end" method="get" th:action="@{/admin/users}">
                <div class="col-md-9"><label class="form-label">Search</label><input class="form-control" name="search" th:value="${search}" placeholder="Name or email"/></div>
                <div class="col-md-3"><button class="btn btn-navy w-100" type="submit">Search</button></div>
            </form>
            <div class="card-bf"><div class="card-body-bf p-0">
                <div th:if="${page == null or page.content.empty}" class="empty-state"><i class="bi bi-people"></i><h3>No users found</h3></div>
                <div class="table-wrap" th:unless="${page == null or page.content.empty}">
                    <table class="table-bf">
                        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${page.content}">
                            <td th:text="${u.fullName}"></td>
                            <td th:text="${u.email}"></td>
                            <td>
                                <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-flex gap-1">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <select class="form-select form-select-sm" name="role" style="min-width:150px" onchange="this.form.submit()">
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.displayName}" th:selected="${u.role == r}"></option>
                                    </select>
                                </form>
                            </td>
                            <td><span class="badge-status" th:classappend="${u.enabled} ? ' badge-success' : ' badge-danger'" th:text="${u.enabled} ? 'Enabled' : 'Disabled'"></span></td>
                            <td class="actions">
                                <a class="btn btn-sm btn-ghost btn-icon" th:href="@{/admin/users/{id}/edit(id=${u.id})}"><i class="bi bi-pencil"></i></a>
                                <form class="inline-form" th:action="@{/admin/users/{id}/toggle-enabled(id=${u.id})}" method="post" data-confirm="Toggle user enabled status?">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button class="btn btn-sm btn-ghost btn-icon" th:title="${u.enabled} ? 'Disable' : 'Enable'"><i class="bi bi-power"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer-bf" th:if="${page != null and !page.content.empty}"><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
