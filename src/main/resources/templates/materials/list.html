<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Materials')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Materials')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header">
                <div><h2>Materials</h2>
                    <p class="subtitle"><span th:text="${lowStockCount}">0</span> items below reorder level ·
                        <a th:href="@{/materials/low-stock}">View low stock</a></p></div>
                <div class="page-actions" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')">
                    <a class="btn btn-outline-navy" th:href="@{/suppliers}">Suppliers</a>
                    <a class="btn btn-primary" th:href="@{/materials/new}"><i class="bi bi-plus-lg me-1"></i> Add Material</a>
                </div>
            </div>
            <form class="filter-bar row g-2 align-items-end" method="get" th:action="@{/materials}">
                <div class="col-md-4"><label class="form-label">Search</label><input class="form-control" name="search" th:value="${search}"/></div>
                <div class="col-md-3"><label class="form-label">Category</label><input class="form-control" name="category" th:value="${category}"/></div>
                <div class="col-md-3"><label class="form-label">Status</label>
                    <select class="form-select" name="status"><option value="">All</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option></select></div>
                <div class="col-md-2"><button class="btn btn-navy w-100" type="submit">Filter</button></div>
            </form>
            <div class="card-bf"><div class="card-body-bf p-0">
                <div th:if="${page == null or page.content.empty}" class="empty-state"><i class="bi bi-box-seam"></i><h3>No materials</h3></div>
                <div class="table-wrap" th:unless="${page == null or page.content.empty}">
                    <table class="table-bf">
                        <thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Qty</th><th>Reorder</th><th>Status</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="m : ${page.content}">
                            <td th:text="${m.materialCode}"></td>
                            <td><a th:href="@{/materials/{id}(id=${m.id})}" th:text="${m.name}"></a></td>
                            <td th:text="${m.category}"></td>
                            <td th:text="${m.currentQuantity} + ' ' + ${m.unit}"></td>
                            <td th:text="${m.reorderLevel}"></td>
                            <td><span class="badge-status" th:classappend="${m.status.name() == 'LOW_STOCK' or m.status.name() == 'OUT_OF_STOCK'} ? ' badge-warning' : ' badge-success'" th:text="${m.status}"></span></td>
                            <td class="actions">
                                <a class="btn btn-sm btn-ghost btn-icon" th:href="@{/materials/{id}(id=${m.id})}"><i class="bi bi-eye"></i></a>
                                <a class="btn btn-sm btn-ghost btn-icon" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')" th:href="@{/materials/{id}/edit(id=${m.id})}"><i class="bi bi-pencil"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer-bf" th:if="${page != null and !page.content.empty}"><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
