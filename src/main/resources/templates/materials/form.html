<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Materials')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Materials')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header"><div><h2 th:text="${pageTitle}">Material</h2></div><a class="btn btn-ghost" th:href="@{/materials}">Back</a></div>
            <div class="card-bf"><div class="card-body-bf">
                <form th:object="${materialForm}" th:action="${materialForm.id == null} ? @{/materials} : @{/materials/{id}(id=${materialForm.id})}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" th:field="*{id}"/>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert-bf error mb-3"><div><p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div></div>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">Code *</label><input class="form-control" th:field="*{materialCode}"/><div class="field-error" th:errors="*{materialCode}"></div></div>
                        <div class="col-md-8"><label class="form-label">Name *</label><input class="form-control" th:field="*{name}"/><div class="field-error" th:errors="*{name}"></div></div>
                        <div class="col-md-4"><label class="form-label">Category</label><input class="form-control" th:field="*{category}"/></div>
                        <div class="col-md-4"><label class="form-label">Unit *</label><input class="form-control" th:field="*{unit}" placeholder="kg, m3, pcs"/><div class="field-error" th:errors="*{unit}"></div></div>
                        <div class="col-md-4"><label class="form-label">Status *</label>
                            <select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></div>
                        <div class="col-md-4"><label class="form-label">Current qty *</label><input type="number" step="0.001" class="form-control" th:field="*{currentQuantity}"/><div class="field-error" th:errors="*{currentQuantity}"></div></div>
                        <div class="col-md-4"><label class="form-label">Reorder level</label><input type="number" step="0.001" class="form-control" th:field="*{reorderLevel}"/></div>
                        <div class="col-md-4"><label class="form-label">Unit cost</label><input type="number" step="0.01" class="form-control" th:field="*{unitCost}"/></div>
                        <div class="col-md-6"><label class="form-label">Supplier</label>
                            <select class="form-select" th:field="*{supplierId}"><option value="">None</option>
                                <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select></div>
                        <div class="col-md-6"><label class="form-label">Storage location</label><input class="form-control" th:field="*{storageLocation}"/></div>
                    </div>
                    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Save Material</button><a class="btn btn-ghost" th:href="@{/materials}">Cancel</a></div>
                </form>
            </div></div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
