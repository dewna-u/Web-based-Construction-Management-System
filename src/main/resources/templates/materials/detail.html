<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Materials')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Materials')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="detail-hero">
                <h1 th:text="${material.name}">Material</h1>
                <div class="meta">
                    <span th:text="${material.materialCode}"></span>
                    <span th:text="${material.category}"></span>
                    <span class="badge-status badge-primary" th:text="${material.status}"></span>
                </div>
                <div class="hero-actions">
                    <a class="btn btn-primary btn-sm" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')" th:href="@{/materials/{id}/edit(id=${material.id})}">Edit</a>
                    <form class="inline-form" sec:authorize="hasRole('ADMIN')" th:action="@{/materials/{id}/delete(id=${material.id})}" method="post" data-confirm="Delete this material?">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-danger-soft btn-sm">Delete</button>
                    </form>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-lg-7">
                    <div class="card-bf"><div class="card-body-bf">
                        <div class="info-grid">
                            <div class="info-item"><label>Quantity</label><div class="value" th:text="${material.currentQuantity} + ' ' + ${material.unit}"></div></div>
                            <div class="info-item"><label>Reorder level</label><div class="value" th:text="${material.reorderLevel}"></div></div>
                            <div class="info-item"><label>Unit cost</label><div class="value" th:text="${material.unitCost}"></div></div>
                            <div class="info-item"><label>Supplier</label><div class="value" th:text="${material.supplier != null ? material.supplier.name : '—'}"></div></div>
                            <div class="info-item"><label>Storage</label><div class="value" th:text="${material.storageLocation != null ? material.storageLocation : '—'}"></div></div>
                        </div>
                    </div></div>
                </div>
                <div class="col-lg-5">
                    <div class="card-bf"><div class="card-body-bf">
                        <h3 class="form-section-title">Adjust stock</h3>
                        <form th:object="${stockAdjustmentForm}" th:action="@{/materials/{id}/adjust-stock(id=${material.id})}" method="post" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" th:field="*{materialId}"/>
                            <div class="mb-3"><label class="form-label">Adjustment qty (+/-) *</label>
                                <input type="number" step="0.001" class="form-control" th:field="*{adjustmentQuantity}"/>
                                <div class="field-error" th:errors="*{adjustmentQuantity}"></div></div>
                            <div class="mb-3"><label class="form-label">Reason</label>
                                <input class="form-control" th:field="*{reason}"/><div class="field-error" th:errors="*{reason}"></div></div>
                            <button class="btn btn-primary w-100" type="submit">Apply adjustment</button>
                        </form>
                    </div></div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
