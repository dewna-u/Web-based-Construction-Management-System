<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Progress Updates')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Progress Updates')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header">
                <div><h2>Progress Updates</h2><p class="subtitle">Site progress logs and percent complete</p></div>
                <div class="page-actions" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER')">
                    <a class="btn btn-primary" th:href="@{/progress/new}"><i class="bi bi-plus-lg me-1"></i> Add Update</a>
                </div>
            </div>
            <form class="filter-bar row g-2 align-items-end" method="get" th:action="@{/progress}">
                <div class="col-md-9"><label class="form-label">Project</label>
                    <select class="form-select" name="projectId"><option value="">All</option>
                        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${projectId == p.id}"></option></select></div>
                <div class="col-md-3"><button class="btn btn-navy w-100" type="submit">Filter</button></div>
            </form>
            <div class="card-bf"><div class="card-body-bf p-0">
                <div th:if="${page == null or page.content.empty}" class="empty-state"><i class="bi bi-graph-up"></i><h3>No progress updates</h3></div>
                <div class="table-wrap" th:unless="${page == null or page.content.empty}">
                    <table class="table-bf">
                        <thead><tr><th>Date</th><th>Project</th><th>Summary</th><th>Progress</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${page.content}">
                            <td th:text="${u.updateDate}"></td>
                            <td th:text="${u.project != null ? u.project.name : '—'}"></td>
                            <td><a th:href="@{/progress/{id}(id=${u.id})}" th:text="${u.summary}"></a></td>
                            <td>
                                <div class="progress-label"><span th:text="${u.progressPercentage} + '%'"></span></div>
                                <div class="progress-bf"><div class="bar" th:style="'width:' + ${u.progressPercentage} + '%'"></div></div>
                            </td>
                            <td class="actions">
                                <a class="btn btn-sm btn-ghost btn-icon" th:href="@{/progress/{id}(id=${u.id})}"><i class="bi bi-eye"></i></a>
                                <a class="btn btn-sm btn-ghost btn-icon" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER')" th:href="@{/progress/{id}/edit(id=${u.id})}"><i class="bi bi-pencil"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer-bf" th:if="${page != null and !page.content.empty}"><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
