<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Progress Updates')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Progress Updates')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="detail-hero">
                <h1 th:text="${progressUpdate.summary}">Update</h1>
                <div class="meta">
                    <span th:text="${progressUpdate.project != null ? progressUpdate.project.name : '—'}"></span>
                    <span th:text="${progressUpdate.updateDate}"></span>
                    <span th:text="${progressUpdate.progressPercentage} + '%'"></span>
                </div>
                <div class="hero-actions">
                    <a class="btn btn-primary btn-sm" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER')" th:href="@{/progress/{id}/edit(id=${progressUpdate.id})}">Edit</a>
                    <form class="inline-form" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')" th:action="@{/progress/{id}/delete(id=${progressUpdate.id})}" method="post" data-confirm="Delete this update?">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-danger-soft btn-sm">Delete</button>
                    </form>
                </div>
            </div>
            <div class="card-bf"><div class="card-body-bf">
                <div class="progress-bf mb-4" style="height:12px"><div class="bar" th:style="'width:' + ${progressUpdate.progressPercentage} + '%'"></div></div>
                <div class="mb-3" th:if="${progressUpdate.workCompleted}"><label class="form-label">Work completed</label><p th:text="${progressUpdate.workCompleted}"></p></div>
                <div class="mb-3" th:if="${progressUpdate.nextPlannedWork}"><label class="form-label">Next planned</label><p th:text="${progressUpdate.nextPlannedWork}"></p></div>
                <div th:if="${progressUpdate.imagePath}"><label class="form-label">Image</label><p><a th:href="${progressUpdate.imagePath}" th:text="${progressUpdate.imagePath}" target="_blank"></a></p></div>
            </div></div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
