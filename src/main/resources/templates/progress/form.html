<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Progress Updates')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Progress Updates')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header"><div><h2 th:text="${pageTitle}">Progress</h2></div><a class="btn btn-ghost" th:href="@{/progress}">Back</a></div>
            <div class="card-bf"><div class="card-body-bf">
                <form th:object="${progressUpdateForm}" th:action="${progressUpdateForm.id == null} ? @{/progress} : @{/progress/{id}(id=${progressUpdateForm.id})}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" th:field="*{id}"/>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert-bf error mb-3"><div><p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div></div>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Project *</label>
                            <select class="form-select" th:field="*{projectId}"><option value="">Select</option>
                                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option></select>
                            <div class="field-error" th:errors="*{projectId}"></div></div>
                        <div class="col-md-3"><label class="form-label">Update date *</label><input type="date" class="form-control" th:field="*{updateDate}"/><div class="field-error" th:errors="*{updateDate}"></div></div>
                        <div class="col-md-3"><label class="form-label">Progress % *</label><input type="number" min="0" max="100" class="form-control" th:field="*{progressPercentage}"/><div class="field-error" th:errors="*{progressPercentage}"></div></div>
                        <div class="col-12"><label class="form-label">Summary *</label><textarea class="form-control" rows="2" th:field="*{summary}"></textarea><div class="field-error" th:errors="*{summary}"></div></div>
                        <div class="col-md-6"><label class="form-label">Work completed</label><textarea class="form-control" rows="3" th:field="*{workCompleted}"></textarea></div>
                        <div class="col-md-6"><label class="form-label">Next planned work</label><textarea class="form-control" rows="3" th:field="*{nextPlannedWork}"></textarea></div>
                        <div class="col-12"><label class="form-label">Image path</label><input class="form-control" th:field="*{imagePath}" placeholder="/uploads/..."/></div>
                    </div>
                    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Save Update</button><a class="btn btn-ghost" th:href="@{/progress}">Cancel</a></div>
                </form>
            </div></div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
