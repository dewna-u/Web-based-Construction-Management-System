<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Tasks')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Tasks')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="detail-hero">
                <h1 th:text="${task.title}">Task</h1>
                <div class="meta">
                    <span><i class="bi bi-kanban"></i><span th:text="${task.project != null ? task.project.name : '—'}"></span></span>
                    <span><i class="bi bi-person"></i><span th:text="${task.assignee != null ? task.assignee.fullName : 'Unassigned'}"></span></span>
                    <span><i class="bi bi-flag"></i><span th:text="${task.status}"></span></span>
                    <span th:if="${overdue}" class="badge-status badge-danger">Overdue</span>
                </div>
                <div class="hero-actions">
                    <a class="btn btn-primary btn-sm" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER')" th:href="@{/tasks/{id}/edit(id=${task.id})}">Edit</a>
                    <form class="inline-form" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')" th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" data-confirm="Delete this task?">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-danger-soft btn-sm">Delete</button>
                    </form>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-lg-8">
                    <div class="card-bf mb-3"><div class="card-body-bf">
                        <h3 class="form-section-title">Details</h3>
                        <div class="info-grid">
                            <div class="info-item"><label>Priority</label><div class="value" th:text="${task.priority}"></div></div>
                            <div class="info-item"><label>Start</label><div class="value" th:text="${task.startDate != null ? task.startDate : '—'}"></div></div>
                            <div class="info-item"><label>Due</label><div class="value" th:text="${task.dueDate != null ? task.dueDate : '—'}"></div></div>
                            <div class="info-item"><label>Completion</label><div class="value" th:text="${task.completionPercentage} + '%'"></div></div>
                        </div>
                        <div class="mt-3">
                            <label class="form-label">Description</label>
                            <p th:text="${task.description != null ? task.description : 'No description'}" class="mb-0"></p>
                        </div>
                        <div class="mt-3" th:if="${task.notes}">
                            <label class="form-label">Notes</label>
                            <p th:text="${task.notes}" class="mb-0"></p>
                        </div>
                    </div></div>
                </div>
                <div class="col-lg-4">
                    <div class="card-bf"><div class="card-body-bf">
                        <h3 class="form-section-title">Update status</h3>
                        <form th:action="@{/tasks/{id}/status(id=${task.id})}" method="post" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER','CONTRACTOR')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <select class="form-select mb-3" name="status">
                                <option value="TODO" th:selected="${task.status.name() == 'TODO'}">TODO</option>
                                <option value="IN_PROGRESS" th:selected="${task.status.name() == 'IN_PROGRESS'}">IN_PROGRESS</option>
                                <option value="BLOCKED" th:selected="${task.status.name() == 'BLOCKED'}">BLOCKED</option>
                                <option value="COMPLETED" th:selected="${task.status.name() == 'COMPLETED'}">COMPLETED</option>
                            </select>
                            <button type="submit" class="btn btn-primary w-100">Save status</button>
                        </form>
                        <div class="progress-bf mt-3" style="height:10px">
                            <div class="bar" th:style="'width:' + ${task.completionPercentage} + '%'"></div>
                        </div>
                    </div></div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
