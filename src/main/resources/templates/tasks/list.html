<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Tasks')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Tasks')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header">
                <div>
                    <h2>Tasks</h2>
                    <p class="subtitle"><span th:text="${overdueCount}">0</span> overdue across sites</p>
                </div>
                <div class="page-actions" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER')">
                    <a class="btn btn-primary" th:href="@{/tasks/new}"><i class="bi bi-plus-lg me-1"></i> New Task</a>
                </div>
            </div>
            <form class="filter-bar row g-2 align-items-end" method="get" th:action="@{/tasks}">
                <div class="col-md-3">
                    <label class="form-label">Search</label>
                    <input class="form-control" name="search" th:value="${search}" placeholder="Title"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Project</label>
                    <select class="form-select" name="projectId">
                        <option value="">All</option>
                        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${projectId == p.id}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status">
                        <option value="">All</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Priority</label>
                    <select class="form-select" name="priority">
                        <option value="">All</option>
                        <option th:each="pr : ${priorities}" th:value="${pr}" th:text="${pr}" th:selected="${priority == pr}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Assignee</label>
                    <select class="form-select" name="assigneeId">
                        <option value="">All</option>
                        <option th:each="a : ${assignees}" th:value="${a.id}" th:text="${a.fullName}" th:selected="${assigneeId == a.id}"></option>
                    </select>
                </div>
                <div class="col-md-1">
                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" name="overdueOnly" value="true" id="overdueOnly" th:checked="${overdueOnly == true}"/>
                        <label class="form-check-label" for="overdueOnly">Overdue</label>
                    </div>
                </div>
                <div class="col-12"><button class="btn btn-navy" type="submit">Apply filters</button></div>
            </form>
            <div class="card-bf">
                <div class="card-body-bf p-0">
                    <div th:if="${page == null or page.content.empty}" class="empty-state">
                        <i class="bi bi-check2-square"></i><h3>No tasks found</h3>
                    </div>
                    <div class="table-wrap" th:unless="${page == null or page.content.empty}">
                        <table class="table-bf">
                            <thead><tr><th>Title</th><th>Project</th><th>Assignee</th><th>Priority</th><th>Status</th><th>Due</th><th>%</th><th></th></tr></thead>
                            <tbody>
                            <tr th:each="t : ${page.content}">
                                <td><a th:href="@{/tasks/{id}(id=${t.id})}" th:text="${t.title}"></a></td>
                                <td th:text="${t.project != null ? t.project.name : '—'}"></td>
                                <td th:text="${t.assignee != null ? t.assignee.fullName : '—'}"></td>
                                <td><span class="badge-status" th:classappend="${t.priority.name() == 'URGENT' or t.priority.name() == 'HIGH'} ? ' badge-danger' : ' badge-secondary'" th:text="${t.priority}"></span></td>
                                <td><span class="badge-status badge-navy" th:text="${t.status}"></span></td>
                                <td th:text="${t.dueDate}"></td>
                                <td th:text="${t.completionPercentage} + '%'"></td>
                                <td class="actions">
                                    <a class="btn btn-sm btn-ghost btn-icon" th:href="@{/tasks/{id}(id=${t.id})}"><i class="bi bi-eye"></i></a>
                                    <a class="btn btn-sm btn-ghost btn-icon" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER','SITE_ENGINEER')" th:href="@{/tasks/{id}/edit(id=${t.id})}"><i class="bi bi-pencil"></i></a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer-bf" th:if="${page != null and !page.content.empty}">
                    <div th:replace="~{fragments/layout :: pagination(${page})}"></div>
                </div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
