<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>403 · BuildFlow</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="error-page">
    <div class="error-card">
        <p class="error-code"><span th:text="${status} ?: 403">403</span></p>
        <h1>Access Denied</h1>
        <p th:text="${message} ?: 'You do not have permission to view this page.'">You do not have permission to view this page.</p>
        <a class="btn btn-primary" th:href="@{/dashboard}"><i class="bi bi-house me-1"></i> Back to Dashboard</a>
        <a class="btn btn-ghost ms-2" th:href="@{/login}">Sign in</a>
    </div>
</div>
</body>
</html>
