<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sign In · BuildFlow</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-hero">
        <div class="auth-hero-content">
            <div class="logo-mark"><i class="bi bi-buildings"></i></div>
            <h1>Construction Management System</h1>
            <p class="tagline">Plan. Track. Build.</p>
            <p>Coordinate projects, workforce, materials, and budgets from one construction command center.</p>
        </div>
    </div>
    <div class="auth-panel">
        <div class="auth-card">
            <h2>Welcome back</h2>
            <p class="auth-sub">Sign in to your BuildFlow account</p>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form th:action="@{/login}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label" for="username">Email</label>
                    <input type="email" class="form-control" id="username" name="username"
                           placeholder="you@company.com" required autofocus autocomplete="username"/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="••••••••" required autocomplete="current-password"/>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="auth-footer-links">
                New here? <a th:href="@{/signup}">Create an account</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
