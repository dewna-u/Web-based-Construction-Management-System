<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Initial Setup · BuildFlow</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-hero">
        <div class="auth-hero-content">
            <div class="logo-mark"><i class="bi bi-buildings"></i></div>
            <h1>Construction Management System</h1>
            <p class="tagline">Plan. Track. Build.</p>
            <p>Create the first administrator account to unlock your construction workspace.</p>
        </div>
    </div>
    <div class="auth-panel">
        <div class="auth-card">
            <h2>First-time setup</h2>
            <p class="auth-sub">Create the system administrator</p>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form th:action="@{/setup}" th:object="${setupForm}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div th:if="${#fields.hasGlobalErrors()}" class="alert-bf error mb-3">
                    <i class="bi bi-exclamation-octagon-fill"></i>
                    <div>
                        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0">Error</p>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="fullName">Full name</label>
                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Admin email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    <ul class="password-hints">
                        <li><i class="bi bi-check2"></i> Minimum 8 characters</li>
                        <li><i class="bi bi-check2"></i> Choose a strong unique password</li>
                    </ul>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Confirm password</label>
                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                           th:classappend="${#fields.hasErrors('confirmPassword') or #fields.hasErrors('passwordConfirmed')} ? ' is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    <div class="field-error" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-shield-check me-1"></i> Create Admin
                </button>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
