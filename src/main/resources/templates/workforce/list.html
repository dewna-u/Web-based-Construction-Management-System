<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Workforce')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Workforce')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header">
                <div>
                    <h2>Workforce</h2>
                    <p class="subtitle"><span th:text="${activeCount}">0</span> active workers on site</p>
                </div>
                <div class="page-actions" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')">
                    <a class="btn btn-primary" th:href="@{/workforce/new}"><i class="bi bi-plus-lg me-1"></i> Add Worker</a>
                </div>
            </div>
            <form class="filter-bar row g-2 align-items-end" method="get" th:action="@{/workforce}">
                <div class="col-md-4"><label class="form-label">Search</label><input class="form-control" name="search" th:value="${search}"/></div>
                <div class="col-md-3"><label class="form-label">Status</label>
                    <select class="form-select" name="status"><option value="">All</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option>
                    </select>
                </div>
                <div class="col-md-3"><label class="form-label">Project</label>
                    <select class="form-select" name="projectId"><option value="">All</option>
                        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}" th:selected="${projectId == p.id}"></option>
                    </select>
                </div>
                <div class="col-md-2"><button class="btn btn-navy w-100" type="submit">Filter</button></div>
            </form>
            <div class="card-bf"><div class="card-body-bf p-0">
                <div th:if="${page == null or page.content.empty}" class="empty-state"><i class="bi bi-people"></i><h3>No workers found</h3></div>
                <div class="table-wrap" th:unless="${page == null or page.content.empty}">
                    <table class="table-bf">
                        <thead><tr><th>Code</th><th>Name</th><th>Trade</th><th>Type</th><th>Project</th><th>Status</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="w : ${page.content}">
                            <td th:text="${w.workerCode}"></td>
                            <td><a th:href="@{/workforce/{id}(id=${w.id})}" th:text="${w.fullName}"></a>
                                <div class="small text-muted-bf" th:text="${w.phone}"></div></td>
                            <td th:text="${w.tradeSkill}"></td>
                            <td th:text="${w.employmentType}"></td>
                            <td th:text="${w.assignedProject != null ? w.assignedProject.name : '—'}"></td>
                            <td><span class="badge-status" th:classappend="${w.status.name() == 'ACTIVE'} ? ' badge-success' : ' badge-secondary'" th:text="${w.status}"></span></td>
                            <td class="actions">
                                <a class="btn btn-sm btn-ghost btn-icon" th:href="@{/workforce/{id}(id=${w.id})}"><i class="bi bi-eye"></i></a>
                                <a class="btn btn-sm btn-ghost btn-icon" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')" th:href="@{/workforce/{id}/edit(id=${w.id})}"><i class="bi bi-pencil"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer-bf" th:if="${page != null and !page.content.empty}"><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
