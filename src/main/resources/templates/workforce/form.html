<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Workforce')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Workforce')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-header"><div><h2 th:text="${pageTitle}">Worker</h2></div><a class="btn btn-ghost" th:href="@{/workforce}">Back</a></div>
            <div class="card-bf"><div class="card-body-bf">
                <form th:object="${workerForm}" th:action="${workerForm.id == null} ? @{/workforce} : @{/workforce/{id}(id=${workerForm.id})}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" th:field="*{id}"/>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert-bf error mb-3"><div><p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div></div>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">Worker code *</label><input class="form-control" th:field="*{workerCode}"/><div class="field-error" th:errors="*{workerCode}"></div></div>
                        <div class="col-md-8"><label class="form-label">Full name *</label><input class="form-control" th:field="*{fullName}"/><div class="field-error" th:errors="*{fullName}"></div></div>
                        <div class="col-md-4"><label class="form-label">NIC</label><input class="form-control" th:field="*{nic}"/></div>
                        <div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" th:field="*{phone}"/></div>
                        <div class="col-md-4"><label class="form-label">Email</label><input class="form-control" th:field="*{email}"/><div class="field-error" th:errors="*{email}"></div></div>
                        <div class="col-md-4"><label class="form-label">Trade / skill</label><input class="form-control" th:field="*{tradeSkill}"/></div>
                        <div class="col-md-4"><label class="form-label">Employment type *</label>
                            <select class="form-select" th:field="*{employmentType}"><option th:each="t : ${employmentTypes}" th:value="${t}" th:text="${t}"></option></select></div>
                        <div class="col-md-4"><label class="form-label">Daily rate</label><input type="number" step="0.01" class="form-control" th:field="*{dailyRate}"/><div class="field-error" th:errors="*{dailyRate}"></div></div>
                        <div class="col-md-4"><label class="form-label">Status *</label>
                            <select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></div>
                        <div class="col-md-4"><label class="form-label">Assigned project</label>
                            <select class="form-select" th:field="*{assignedProjectId}"><option value="">None</option>
                                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option></select></div>
                        <div class="col-md-4"><label class="form-label">Linked user</label>
                            <select class="form-select" th:field="*{linkedUserId}"><option value="">None</option>
                                <option th:each="u : ${linkableUsers}" th:value="${u.id}" th:text="${u.fullName}"></option></select></div>
                    </div>
                    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Save Worker</button><a class="btn btn-ghost" th:href="@{/workforce}">Cancel</a></div>
                </form>
            </div></div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
