<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Workforce')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-main">
        <div th:replace="~{fragments/layout :: navbar('Workforce')}"></div>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="detail-hero">
                <h1 th:text="${worker.fullName}">Worker</h1>
                <div class="meta">
                    <span th:text="${worker.workerCode}"></span>
                    <span th:text="${worker.tradeSkill}"></span>
                    <span class="badge-status badge-primary" th:text="${worker.status}"></span>
                </div>
                <div class="hero-actions" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')">
                    <a class="btn btn-primary btn-sm" th:href="@{/workforce/{id}/edit(id=${worker.id})}">Edit</a>
                    <form class="inline-form" th:action="@{/workforce/{id}/deactivate(id=${worker.id})}" method="post" data-confirm="Deactivate this worker?">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-ghost btn-sm text-white border-light">Deactivate</button>
                    </form>
                    <form class="inline-form" sec:authorize="hasRole('ADMIN')" th:action="@{/workforce/{id}/delete(id=${worker.id})}" method="post" data-confirm="Delete this worker?">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-danger-soft btn-sm">Delete</button>
                    </form>
                </div>
            </div>
            <div class="card-bf"><div class="card-body-bf">
                <div class="info-grid">
                    <div class="info-item"><label>Phone</label><div class="value" th:text="${worker.phone != null ? worker.phone : '—'}"></div></div>
                    <div class="info-item"><label>Email</label><div class="value" th:text="${worker.email != null ? worker.email : '—'}"></div></div>
                    <div class="info-item"><label>NIC</label><div class="value" th:text="${worker.nic != null ? worker.nic : '—'}"></div></div>
                    <div class="info-item"><label>Employment</label><div class="value" th:text="${worker.employmentType}"></div></div>
                    <div class="info-item"><label>Daily rate</label><div class="value" th:text="${worker.dailyRate != null ? worker.dailyRate : '—'}"></div></div>
                    <div class="info-item"><label>Project</label><div class="value" th:text="${worker.assignedProject != null ? worker.assignedProject.name : '—'}"></div></div>
                    <div class="info-item"><label>Linked user</label><div class="value" th:text="${worker.linkedUser != null ? worker.linkedUser.fullName : '—'}"></div></div>
                </div>
            </div></div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
