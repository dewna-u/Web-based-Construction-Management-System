server.port=8080
spring.application.name=construction-management-system

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/construction_db}
spring.datasource.username=${DB_USERNAME:construction_user}
spring.datasource.password=${DB_PASSWORD:construction_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload.dir=${UPLOAD_DIR:uploads}
app.demo.enabled=${DEMO_ENABLED:true}
